<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A simple starter website built with HTML, CSS, and JavaScript."
    />
    <title>Simple Site</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="logo" href="#home">Simple Site</a>
      <nav aria-label="Main navigation">
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
        <a href="vault.html">Vault</a>
      </nav>
    </header>

    <main>
      <section class="hero" id="home">
        <p class="eyebrow">Welcome</p>
        <h1>A simple website starter.</h1>
        <p>Use this space to introduce your site, service, or idea.</p>
        <button class="button" id="welcome-button" type="button">Get started</button>
        <p class="message" id="welcome-message" aria-live="polite"></p>
      </section>

      <section class="section" id="about">
        <h2>About</h2>
        <p>Add a short description of what makes your website useful.</p>
      </section>

      <section class="section" id="contact">
        <h2>Contact</h2>
        <p>Email: hello@example.com</p>
      </section>
    </main>

    <footer class="site-footer">
      <p>&copy; <span id="year"></span> Simple Site. All rights reserved.</p>
    </footer>
  </body>
</html>
